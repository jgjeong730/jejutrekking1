<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fff; }
  #card {
    width: 600px;
    height: 315px;
    position: absolute;
    top: 0;
    left: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #0284c7 0%, #22d3ee 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    overflow: hidden;
  }
  .badge {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .row { display: flex; align-items: center; gap: 12px; }
  .row svg { width: 38px; height: 38px; flex-shrink: 0; }
  .title { font-size: 34px; font-weight: 900; white-space: nowrap; letter-spacing: -0.02em; }
  .subtitle { margin-top: 11px; font-size: 14px; color: rgba(255,255,255,0.92); font-weight: 500; white-space: nowrap; }
  .stats {
    margin-top: 22px;
    display: flex;
    background: rgba(255,255,255,0.18);
    border-radius: 14px;
    padding: 10px 16px;
  }
  .stat { text-align: center; padding: 0 13px; }
  .stat + .stat { border-left: 1px solid rgba(255,255,255,0.35); }
  .stat .num { font-size: 16px; font-weight: 900; white-space: nowrap; }
  .stat .label { font-size: 9px; color: rgba(255,255,255,0.85); margin-top: 2px; white-space: nowrap; }
</style>
</head>
<body>
<div id="card">
  <div class="badge">JEJU OLLE TRAIL · 2026</div>
  <div class="row">
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="5" y="5" width="15" height="15" rx="3" stroke="white" stroke-width="3" />
      <path d="M12.5 20 V29 H33" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="28" y="29" width="15" height="14" rx="3" stroke="white" stroke-width="3" />
    </svg>
    <div class="title">제주올레길 완주플랜</div>
  </div>
  <div class="subtitle">2026.10.23 ~ 11.19 확정 일정</div>
  <div class="stats">
    <div class="stat"><div class="num">437km</div><div class="label">총 연장</div></div>
    <div class="stat"><div class="num">27개</div><div class="label">공식 코스</div></div>
    <div class="stat"><div class="num">26일</div><div class="label">완주 일정</div></div>
  </div>
</div>
</body>
</html>
